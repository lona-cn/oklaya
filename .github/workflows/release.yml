name: Release

on:
  push:
    branches:
      - master
    tags:
      - 'v[0-9]*'
    paths:
      - '.github/workflows/release.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/laya-inference/**'
      - 'crates/laya-android/**'
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/laya-inference/**'
      - 'crates/laya-android/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-x64:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Select Rust toolchain
        run: |
          rustup update stable
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain update failed' }
          rustup default stable
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain selection failed' }

      - name: Test and build Windows binaries
        run: |
          cargo test --workspace --locked
          if ($LASTEXITCODE -ne 0) { throw 'Workspace tests failed' }
          cargo build --workspace --release --locked
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed' }

      - name: Verify released multilingual model and run inference parity
        run: |
          New-Item -ItemType Directory -Force .model-assets | Out-Null
          gh release download models-1bc2622 --repo $env:GITHUB_REPOSITORY --pattern laya-model-multilingual.zip --dir .model-assets
          if ($LASTEXITCODE -ne 0) { throw 'Model Release download failed' }
          Expand-Archive .model-assets/laya-model-multilingual.zip -DestinationPath .model-assets/unpacked
          $expected = @{
            'model.onnx' = 'da6a0f87380597f679b12ce539e0a187e923fcffcf8dfc2f035728388dceacb0'
            'rl_agent_config.json' = '25061739243b617ad88d1219ba6f8a9c86c5881ca28df024fa2d9b3b2fcc30c6'
            'onnx_config.json' = '7eff4d0af9a8b22b977b690ab9e7d97ea2cda6c0a449e53502c06f7db2ae915f'
            'tokenizer/tokenizer.json' = '609d8f4c067cd3950f88594c5a802616cea245823836ef5848ee4fc40aab5b6f'
            'tokenizer/tokenizer_config.json' = '6c6b2d8e3c84ce0e671c129cd6b374b235d6f9863042a5836358d00a89bbb5a1'
          }
          foreach ($relative in $expected.Keys) {
            $file = Join-Path '.model-assets/unpacked/multilingual' $relative
            if (-not (Test-Path $file)) { throw "Missing model file: $relative" }
            if ((Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected[$relative]) {
              throw "Model checksum mismatch: $relative"
            }
          }
          $env:LAYA_RUN_MODEL_TESTS = '1'
          $env:LAYA_MODEL_DIR = (Resolve-Path .model-assets/unpacked/multilingual).Path
          cargo test -p laya-inference --test reference --locked
          if ($LASTEXITCODE -ne 0) { throw 'Released model parity test failed' }

      - name: Collect third-party dependency notices
        run: python scripts/collect-licenses.py dist/THIRD_PARTY_NOTICES.txt

      - name: Package Windows applications
        run: |
          $directory = 'dist/oklaya-windows-x64'
          New-Item -ItemType Directory -Force $directory | Out-Null
          foreach ($name in @('laya', 'laya-inspect', 'laya-gui-server', 'laya-gui-client')) {
            Copy-Item "target/release/$name.exe" $directory
          }
          Copy-Item README.md, README.zh-CN.md, LICENSE, NOTICE, dist/THIRD_PARTY_NOTICES.txt $directory
          $archive = "oklaya-$env:GITHUB_REF_NAME-windows-x64.zip"
          Compress-Archive -Path "$directory/*" -DestinationPath "dist/$archive" -CompressionLevel Optimal
          $hash = (Get-FileHash "dist/$archive" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content dist/SHA256SUMS.txt -Encoding ascii

      - name: Store Windows build for publication or inspection
        uses: actions/upload-artifact@v7
        with:
          name: oklaya-windows-x64
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          retention-days: 7


  android-arm64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4
      - name: Install Android SDK and NDK
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;30.0.14904198"
          echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.14904198" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install compatible Tauri CLI
        run: cargo install tauri-cli --version 2.11.2 --locked

      - name: Restore Android release signing key
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          LAYA_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          LAYA_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LAYA_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 LAYA_ANDROID_STORE_PASSWORD LAYA_ANDROID_KEY_ALIAS LAYA_ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing Android release signing secret: $name"
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/laya-release.jks"
          chmod 600 "$RUNNER_TEMP/laya-release.jks"
          echo "LAYA_ANDROID_KEYSTORE=$RUNNER_TEMP/laya-release.jks" >> "$GITHUB_ENV"

      - name: Build signed Android release APK
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        working-directory: crates/laya-android
        env:
          LAYA_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          LAYA_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LAYA_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: cargo tauri android build --ci --target aarch64 --split-per-abi --apk

      - name: Build Android CI debug APK
        if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/v')
        working-directory: crates/laya-android
        run: cargo tauri android build --ci --debug --target aarch64 --split-per-abi --apk

      - name: Verify and stage Android APK
        run: |
          set -euo pipefail
          mkdir -p dist
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/tags/v* ]]; then
            apk=crates/laya-android/gen/android/app/build/outputs/apk/arm64/release/app-arm64-release.apk
            destination="dist/oklaya-$GITHUB_REF_NAME-android-arm64.apk"
          else
            apk=crates/laya-android/gen/android/app/build/outputs/apk/arm64/debug/app-arm64-debug.apk
            destination=dist/oklaya-android-arm64-debug.apk
          fi
          test -s "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" > dist/android-signature.txt
          grep -q 'Signer #1 certificate SHA-256 digest:' dist/android-signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 "$apk"
          unzip -Z1 "$apk" > dist/android-apk-contents.txt
          grep -Fx 'lib/arm64-v8a/liblaya_android.so' dist/android-apk-contents.txt
          grep -Fx 'lib/arm64-v8a/libc++_shared.so' dist/android-apk-contents.txt
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/tags/v* ]]; then
            "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" > dist/android-badging.txt
            if grep -q 'CN=Android Debug' dist/android-signature.txt ||
               grep -q '^application-debuggable$' dist/android-badging.txt; then
              echo '::error::Refusing to publish a debug-signed or debuggable APK'
              exit 1
            fi
          fi
          cp "$apk" "$destination"

      - name: Store Android build for publication or inspection
        uses: actions/upload-artifact@v7
        with:
          name: oklaya-android-arm64
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [windows-x64, android-arm64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: oklaya-windows-x64
          path: dist/windows

      - uses: actions/download-artifact@v8
        with:
          name: oklaya-android-arm64
          path: dist/android

      - name: Publish both platforms in one GitHub Release
        run: |
          set -euo pipefail
          cp dist/windows/*.zip dist/
          cp dist/android/*.apk dist/
          (cd dist && sha256sum *.zip *.apk > SHA256SUMS.txt)
          notes="Windows x64 CLI, administrator and client; Android ARM64 signed APK (CPU inference, Android 7.0+). Model weights are separate and downloaded on first use. Android guide: https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/android.md . Verified model: https://github.com/$GITHUB_REPOSITORY/releases/tag/models-1bc2622 ."
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.apk dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "oklaya $GITHUB_REF_NAME" --notes "$notes"
